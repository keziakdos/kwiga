# Kwiga — vhost Nginx de référence.
# NE PAS copier tel quel sans sauvegarde préalable de la configuration existante.
# Adapter les chemins de certificats fournis par Certbot.

server {
    listen 80;
    server_name kwiga.rwazap.com;

    # Laisser Certbot gérer la redirection HTTPS ; sinon décommenter :
    # return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 30m;
    }
}

